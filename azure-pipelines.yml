
trigger:
  branches:
    include:
      - main

pool:
  name: agent-VM-wala

stages:
  - stage: Build
    displayName: Build Axion UI
    jobs:
      - job: BuildFrontend
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: '22.x'

          - script: npm ci
            displayName: Install dependencies

          - script: npm run lint
            displayName: Run lint

          - script: npm run build
            displayName: Build frontend

          - task: PublishPipelineArtifact@1
            displayName: Publish build artifact
            inputs:
              targetPath: dist
              artifact: axion-ui-dist
              publishLocation: pipeline
